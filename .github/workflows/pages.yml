name: Publier le portail pédagogique

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Reconstruire le cours de mécanique quantique avancée
        run: |
          mkdir -p ressources
          cat encoded/mqa-*.b64 | base64 --decode > ressources/cours-mecanique-quantique-avancee.pdf
          echo '646c923277c42f5a00827ca34c672bcf19851cb8339c74d01211208c108ef62f  ressources/cours-mecanique-quantique-avancee.pdf' | sha256sum --check

      - name: Conserver le PDF reconstruit dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ressources/cours-mecanique-quantique-avancee.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publier le PDF de mécanique quantique avancée [skip ci]"
            git push
          fi

      - name: Préparer les fichiers publics
        run: |
          mkdir -p site
          cp index.html lecteur.html favicon.svg robots.txt .nojekyll site/
          cp -r assets ressources site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Mettre en ligne
        id: deployment
        uses: actions/deploy-pages@v4
